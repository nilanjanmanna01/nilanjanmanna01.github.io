# The Site Configuration
#
# This site uses a hand-written custom theme (layouts/includes/sass live
# directly in this repo — see _layouts/, _includes/, _sass/, assets/css/,
# assets/js/). It is not built on a packaged Jekyll theme gem.

# The language of the webpage › http://www.lingoes.net/en/translator/langcode.htm
lang: en

# Change to your timezone › https://zones.arilyn.cc
timezone: America/New_York

# jekyll-seo-tag settings › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: Nilanjan Manna # PLACEHOLDER: personalize this, e.g. "Nilanjan Manna's Blog" or a project-style name

tagline: "(Placeholder — one-line statement of what this blog is about; shown as the big headline on the home page)" # PLACEHOLDER: replace before launch

description: >- # used by seo meta and the atom feed; also shown on the home page
  (Placeholder — replace with a 1-2 sentence summary of this blog. Also feeds
  SEO meta tags and the RSS feed, so fill it in before sharing the site
  widely.)

# Fill in the protocol & hostname for your site.
# E.g. 'https://username.github.io', note that it does not end with a '/'.
url: "https://nilanjanmanna01.github.io"

github:
  username: nilanjanmanna01 # change to your GitHub username

twitter:
  username: # leave blank unless this blog has an X/Twitter account — jekyll-seo-tag omits the tag when empty

social:
  # Displayed as the default author of posts and the copyright owner in the footer.
  name: Nilanjan Manna
  email: nilanjan.manna01@gmail.com # change to your preferred public contact address
  fediverse_handle: # fill in your fediverse handle, e.g. "@username@domain.com"
  links:
    # The first element serves as the copyright owner's link.
    - https://github.com/nilanjanmanna01
    # Add more social links as desired, e.g.:
    # - https://www.linkedin.com/in/username

# Site Verification Settings — jekyll-seo-tag emits a verification meta tag for each filled-in value.
webmaster_verifications:
  google: # fill in your Google verification code
  bing: # fill in your Bing verification code
  yandex: # fill in your Yandex verification code
  baidu: # fill in your Baidu verification code
  facebook: # fill in your Facebook verification code

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings

# Web analytics — not wired up yet (no theme code reads these). Left here as a
# landing spot for when analytics is added; filling in an id alone does nothing yet.
analytics:
  google:
    id: # fill in your Google Analytics ID

# The URL of the site-wide social preview image used in SEO `og:image` meta tag.
# Can be overridden per-post by `image:` in front matter. No image set yet by design
# (see _includes/post-card.html for the placeholder treatment used until one exists).
social_preview_image:

# boolean type, the global switch for TOC in posts. Per-post override: `toc: false`.
toc: true

actions:
  # Display an "Edit this post on GitHub" link on each post page.
  edit_post:
    enabled: false # set to true once you're ready to expose this
    url: "https://github.com/nilanjanmanna01/nilanjanmanna01.github.io/edit/main"

comments:
  # Global switch for the post-comment system. Keeping `provider` empty means disabled.
  # giscus (https://giscus.app) is the recommended option — free, GitHub Discussions-backed,
  # no tracking. Fill in the block below and set provider: giscus to enable.
  provider: # [giscus]
  giscus:
    repo: # <gh-username>/<repo>
    repo_id:
    category:
    category_id:
    mapping: pathname

paginate: 10

# The base URL of your site
baseurl: ""

# Plugins Jekyll should require. Previously pulled in implicitly as runtime
# dependencies of the jekyll-theme-chirpy gem — now listed explicitly since
# this repo no longer depends on a theme gem.
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-archives
  - jekyll-paginate

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Rouge Options › https://github.com/jneen/rouge#full-options
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: "" # An empty string here means all files in the project
      type: posts
    values:
      layout: post
      comments: true # Enable comments in posts.
      toc: true # Display TOC in posts.
      # DO NOT modify the following parameter unless you are confident enough
      # to update the code of all other post links in this project.
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs # see `site.collections`
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - POSTING.md
  - LICENSE
  - vendor
  - assets/images/README.md

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
