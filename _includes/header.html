<header class="site-header">
  <div class="wrap site-header-inner">
    <a class="site-mark" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <nav class="site-nav" aria-label="Primary">
      <a href="{{ '/' | relative_url }}">Home</a>
      {% assign tabs = site.tabs | sort: "order" %}
      {% for tab in tabs %}
        {% unless tab.hidden %}
        <a href="{{ tab.url | relative_url }}">{{ tab.title }}</a>
        {% endunless %}
      {% endfor %}
    </nav>

    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
      <svg class="icon icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 4a1 1 0 0 1-1-1V1a1 1 0 1 1 2 0v2a1 1 0 0 1-1 1Zm0 19a1 1 0 0 1-1-1v-2a1 1 0 1 1 2 0v2a1 1 0 0 1-1 1ZM4 13H2a1 1 0 1 1 0-2h2a1 1 0 1 1 0 2Zm19 0h-2a1 1 0 1 1 0-2h2a1 1 0 1 1 0 2ZM5.6 6.99a1 1 0 0 1-.71-.29L3.5 5.31A1 1 0 1 1 4.91 3.9l1.4 1.4a1 1 0 0 1-.7 1.7Zm12.8 12.8a1 1 0 0 1-.71-.3l-1.4-1.4a1 1 0 0 1 1.41-1.41l1.4 1.4a1 1 0 0 1-.7 1.71ZM4.9 20.1a1 1 0 0 1-.7-1.71l1.4-1.4a1 1 0 1 1 1.41 1.41l-1.4 1.4a1 1 0 0 1-.71.3Zm12.8-12.8a1 1 0 0 1-.7-1.71l1.4-1.4A1 1 0 1 1 19.81 5.6l-1.4 1.4a1 1 0 0 1-.71.3ZM12 18a6 6 0 1 1 0-12 6 6 0 0 1 0 12Z"/></svg>
      <svg class="icon icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M20.7 15.3A8.9 8.9 0 0 1 12.9 21 9 9 0 0 1 9 3.3a1 1 0 0 1 1.3 1.3A7 7 0 0 0 19.4 14a1 1 0 0 1 1.3 1.3Z"/></svg>
    </button>
  </div>
</header>
