<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Set theme before first paint to avoid a flash of the wrong color scheme. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23c1440e'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' fill='%23fbf9f6' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">

  {% feed_meta %}
  {% seo %}

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">

  <!--
    Only runs when a leftover service worker (from the old Chirpy PWA setup)
    is already controlling this page. Forces an immediate update check
    instead of waiting for the browser's ~24h background check, so the
    kill-switch at /sw.js retires the old worker right away rather than
    up to a day later. Does nothing for a normal visitor with no worker.
  -->
  <script>
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      navigator.serviceWorker.register("{{ '/sw.js' | relative_url }}");
    }
  </script>
</head>
<body>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}

  <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
